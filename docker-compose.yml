services:
  rabbitmq:
    # The application only uses AMQP. The management image enables an HTTP UI,
    # metrics and extra Erlang processes which are unnecessary in production.
    # Stay on 3.13 for this deployment so the existing RabbitMQ volume does
    # not undergo a major-version migration during this resource hotfix.
    image: rabbitmq:3.13.7-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Keep the broker from consuming a small Coolify host. RabbitMQ will apply
    # backpressure instead of contributing to an OOM situation.
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18
    container_name: devhub-postgres
    environment:
      POSTGRES_DB: devhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - devhub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migrator (Drizzle Push)
  db-migrator:
    image: ghcr.io/th11n/devhub-migrator:4f151708c29033d849faf2d7a0c7228e0340da2c
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Web app (Next.js)
  web:
    image: ghcr.io/th11n/devhub-web:4f151708c29033d849faf2d7a0c7228e0340da2c
    # build:
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    #   args:
    #     NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    #     DATABASE_URL: ${DATABASE_URL}
    #     BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    #     BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    #     CORS_ORIGIN: ${CORS_ORIGIN}
    #     REDIS_URL: ${REDIS_URL}
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - server
    restart: unless-stopped

  # API Server (Bun + Puppeteer)
  server:
    image: ghcr.io/th11n/devhub-server:4f151708c29033d849faf2d7a0c7228e0340da2c
    # build:
    #   context: .
    #   dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # Queue Worker (Bun + Puppeteer)
  queue-worker:
    image: ghcr.io/th11n/devhub-queue-worker:4f151708c29033d849faf2d7a0c7228e0340da2c
    # build:
    #   context: .
    #   dockerfile: apps/queue-worker/Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # Discord Bot (Bun)
  bot:
    image: ghcr.io/th11n/devhub-bot:4f151708c29033d849faf2d7a0c7228e0340da2c
    # build:
    #   context: .
    #   dockerfile: apps/bot/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq
      - db
    ports:
      - "8787:3000"
    restart: unless-stopped

  # CMS (Sanity Studio)
  cms:
    image: ghcr.io/th11n/devhub-cms:4f151708c29033d849faf2d7a0c7228e0340da2c
    # build:
    #   context: .
    #   dockerfile: apps/cms/Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
  devhub_postgres_data:
